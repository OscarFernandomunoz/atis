          <div class="dropzone" id="dropzone" role="button" tabindex="0"
            aria-label="Cargar archivo de nómina en Excel">
            <input type="file" id="fileInput" accept=".xls, .xlsx" required />
            <!-- Resplandor que sigue al puntero. Se mueve con transform para no
                 repintar la aurora de la tarjeta en cada movimiento. -->
            <span class="dropzone-spotlight" aria-hidden="true"></span>
            <div class="dropzone-content">
              <div class="dropzone-icon" aria-hidden="true">
                <span class="dropzone-icon-halo"></span>
                <span class="dropzone-glyph-wrap">
                  <svg class="dropzone-glyph app-icon is-visible" viewBox="0 0 40 40" fill="none"
                    style="--icon-delay: 100ms;">
                    <defs>
                      <linearGradient id="dropzoneGlyphStroke" x1="12" y1="9" x2="28" y2="34"
                        gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#1b1b1b" />
                        <stop offset="1" stop-color="#6a58b8" />
                      </linearGradient>
                    </defs>
                    <path class="dropzone-glyph-tray" d="M9.5 24.5v5a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3v-5"
                      stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                    <path class="dropzone-glyph-arrow" d="M20 27V9.5m0 0-6 6m6-6 6 6"
                      stroke="url(#dropzoneGlyphStroke)" stroke-width="2.6" stroke-linecap="round"
                      stroke-linejoin="round" />
                    <path class="dropzone-glyph-spark" d="M31.5 12v4M29.5 14h4" stroke="#8d7fd8"
                      stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                </span>
                <span class="dropzone-valid-badge">
                  <svg viewBox="0 0 20 20" fill="none">
                    <path d="m5.5 10.2 2.8 2.8 6.2-6.2" stroke="currentColor" stroke-width="2.2"
                      stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
              </div>
              <div class="dropzone-copy">
                <span class="dropzone-eyebrow">Carga de nómina</span>
                <span class="dropzone-text" id="dropzoneText">Arrastra y suelta tu archivo de nómina aquí o haz clic
                  para seleccionarlo.</span>
                <span class="dropzone-meta">
                  <span class="dropzone-chip">Formato .xls / .xlsx</span>
                  <span class="dropzone-chip is-required">Columna 3 obligatoria</span>
                </span>
              </div>
            </div>
            <span class="dropzone-cta" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none">
                <path d="M10 13.5V3.5m0 0L6.4 7.1M10 3.5l3.6 3.6" stroke="currentColor" stroke-width="1.9"
                  stroke-linecap="round" stroke-linejoin="round" />
                <path d="M4 12.5v2.7A1.8 1.8 0 0 0 5.8 17h8.4a1.8 1.8 0 0 0 1.8-1.8v-2.7" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" />
              </svg>
              Seleccionar archivo
            </span>
            <div class="dropzone-illustration-wrap" aria-hidden="true">
              <svg class="illustration" viewBox="0 0 104 104" fill="none">
                <defs>
                  <linearGradient id="illustrationSheetFill" x1="31" y1="12" x2="82" y2="92"
                    gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#232323" />
                    <stop offset="1" stop-color="#151515" />
                  </linearGradient>
                  <linearGradient id="illustrationCheckFill" x1="58" y1="56" x2="86" y2="84"
                    gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#2c2c2c" />
                    <stop offset="1" stop-color="#0b0b0b" />
                  </linearGradient>
                </defs>
                <ellipse class="illustration-shadow" cx="52" cy="91" rx="31" ry="6" />
                <g class="illustration-back-card">
                  <rect x="25" y="18" width="48" height="62" rx="11" />
                  <path d="M37 31h19M37 40h25M37 49h17" />
                </g>
                <g class="illustration-main-card">
                  <path d="M39 12h29l13 13v54a8 8 0 0 1-8 8H39a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8Z" />
                  <path d="M68 12v13h13" class="illustration-fold" />
                  <path class="illustration-table-line" d="M42 42h27M42 52h27M42 62h19" />
                  <path class="illustration-table-line" d="M48 38v31M60 38v31" />
                </g>
                <g class="illustration-check">
                  <circle cx="72" cy="70" r="14" />
                  <path d="m66.5 70 3.5 3.5 7-7" />
                </g>
                <g class="illustration-spark spark-one">
                  <path d="M18 29v8M14 33h8" />
                </g>
                <g class="illustration-spark spark-two">
                  <path d="M88 23v6M85 26h6" />
                </g>
              </svg>
            </div>
          </div>
