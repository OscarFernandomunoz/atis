  <!-- Barra inspirada en VS Code, con controles nativos del sistema operativo -->
  <div class="title-bar">
    <img class="title-bar-app-icon" src="images/sofia-plus.png" alt="" aria-hidden="true" draggable="false">

    <div class="title-bar-drag-region">
      <span class="title-bar-title">AIA · Gestión de nómina</span>
    </div>

    <div class="title-bar-controls windows-window-controls">
      <button class="title-bar-button minimize-button" id="minimizeButton" type="button" aria-label="Minimizar">
        <svg viewBox="0 0 10 1" width="10" height="1" aria-hidden="true">
          <rect width="10" height="1" fill="currentColor" />
        </svg>
      </button>
      <button class="title-bar-button maximize-button" id="maximizeButton" type="button" aria-label="Maximizar">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <rect width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" />
        </svg>
      </button>
      <button class="title-bar-button close-button" id="closeButton" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0 0L10 10M10 0L0 10" stroke="currentColor" stroke-width="1" />
        </svg>
      </button>
    </div>
  </div>
