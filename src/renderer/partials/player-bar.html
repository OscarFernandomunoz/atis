  <!-- Barra tipo reproductor (estilo Spotify): a la izquierda la cédula en curso,
       al centro el play y el progreso de SofiaPlus, y a la derecha el avance del
       carnet que el usuario está señalando. -->
  <footer class="player-bar" aria-label="Automatización de horas de instructores">
    <div class="player-left">
      <span class="player-artwork" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3.5" y="5" width="17" height="14" rx="2.4" stroke="currentColor" stroke-width="1.7" />
          <circle cx="9" cy="11" r="2.1" stroke="currentColor" stroke-width="1.7" />
          <path d="M5.6 16.6c.8-1.8 2-2.7 3.4-2.7s2.6.9 3.4 2.7" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" />
          <path d="M15 10h3.4M15 13.2h3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </span>
      <span class="player-meta">
        <span class="player-title"><span id="playerIdentification">Sin instructor en curso</span><span class="player-name" id="playerInstructorName"></span></span>
        <span class="player-subtitle" id="statusMessage" role="status" aria-live="polite"></span>
      </span>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="player-locate" id="playerLocateButton" type="button" disabled
          title="Ir al carnet que se está consultando" aria-label="Ir al carnet que se está consultando">
          <img src="images/logo.png" alt="" aria-hidden="true" draggable="false" />
        </button>
        <button class="player-play" id="playerPlay" type="button" data-state="idle"
          aria-label="Iniciar la automatización de SofiaPlus">
          <svg class="player-play-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path class="player-glyph player-glyph-play" d="M9.5 6.2v11.6L18.5 12 9.5 6.2Z" />
            <path class="player-glyph player-glyph-pause" d="M9.6 6.6v10.8M14.4 6.6v10.8" />
            <path class="player-glyph player-glyph-success" d="m7.5 12.4 3 3L16.8 9" />
            <path class="player-glyph player-glyph-error" d="M12 7.4v5.8M12 16.6h.01" />
          </svg>
        </button>
        <button class="player-table" id="playerTableButton" type="button" aria-haspopup="dialog"
          title="Ver tabla del archivo cargado" aria-label="Ver la tabla del archivo cargado">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8" />
            <path d="M3 9.5h18M3 14.5h18M9.5 4.5v15" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </button>
      </div>

      <div class="player-progress">
        <span class="player-time" id="playerProgressCurrent">0</span>
        <div class="player-track" id="playerTrack" role="progressbar" aria-label="Avance de la automatización"
          aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <span class="player-track-fill" id="playerProgressFill"></span>
        </div>
        <span class="player-time player-time-total" id="playerProgressTotal">0</span>
      </div>
    </div>

    <div class="player-right">
      <div class="player-hours" id="playerHoursHint" role="status" aria-live="polite" hidden>
        <span class="player-hours-main"></span>
        <span class="player-hours-who"></span>
      </div>
    </div>
  </footer>
